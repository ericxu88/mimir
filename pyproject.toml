[project]
name = "mimisbrunnr"
version = "0.1.0"
description = "Statistically rigorous LLM experiment harness with built-in LLM-as-judge reliability auditing."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.0",
]

[project.scripts]
mimir = "mimir.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required: dist name (mimisbrunnr) != import name (mimir), so hatchling cannot
# auto-detect what to ship in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/mimir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "NPY", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
